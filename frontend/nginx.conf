server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Resolve the backend through Docker's DNS at request time, not once at start:
  # a recreated backend container gets a new IP (otherwise /api and /ws go to the
  # old one and fail with 502 until the frontend is restarted).
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $backend http://backend:8000;

  location /api/ {
    proxy_pass $backend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /ws {
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 1h;  # the server pings every 20 s; this only bounds idle sockets
  }

  # D-24: self-hosted PMTiles, built by `make tiles` into infra/tiles/ and mounted here.
  location /tiles/ {
    alias /srv/tiles/;
    add_header Accept-Ranges bytes;
  }

  location / {
    try_files $uri /index.html;
  }
}
