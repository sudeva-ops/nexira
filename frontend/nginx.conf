# Local docker-compose. The Helm chart has its own copy for Kubernetes
# (infra/helm/nexira/templates/frontend-configmap.yaml) with the same headers.

# Behind another proxy (GitHub Codespaces' port forwarding terminates TLS), keep its scheme,
# so Keycloak sees HTTPS; otherwise our own. Only the scheme is taken from the request: the
# host and client address are always our own (review of demo PR 1, L2). Keycloak's URLs are
# pinned by KC_HOSTNAME anyway.
map $http_x_forwarded_proto $nexira_proto {
  default $scheme;
  "https" "https";
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  include /etc/nginx/snippets/security-headers.conf;

  # Resolve the backend through Docker's DNS at request time, not once at start:
  # a recreated backend container gets a new IP (otherwise /api and /ws go to the
  # old one and fail with 502 until the frontend is restarted).
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $backend http://backend:8000;

  location /api/ {
    include /etc/nginx/snippets/security-headers.conf;  # add_header here replaces the server's
    add_header Cache-Control "no-store" always;  # personal data: never cached (ASVS 8.2.1)
    proxy_pass $backend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /ws {
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 1h;  # the server pings every 20 s; this only bounds idle sockets
  }

  # The public profile (docs/plan-demo-codespaces.md §2): Keycloak on the same origin under
  # /auth (KC_HTTP_RELATIVE_PATH=/auth), so the app, API, WebSocket and login share one
  # origin. Locally Keycloak is reached directly on its own port and nothing uses this.
  # Never the admin console or the master realm on the app's origin (review of demo PR 1, M1):
  # Keycloak's own port stays on 127.0.0.1 and is not forwarded.
  location ^~ /auth/admin/ {
    return 404;
  }
  location ^~ /auth/realms/master/ {
    return 404;
  }

  location /auth/ {
    set $keycloak http://keycloak:8080;
    proxy_pass $keycloak;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $nexira_proto;
    proxy_set_header X-Forwarded-Host $host;
    proxy_buffer_size 16k;  # Keycloak's login responses carry large cookies and headers
    proxy_buffers 8 16k;
    # Keycloak's pages carry Keycloak's own security headers (its CSP allows its own inline
    # scripts). An add_header here stops nginx inheriting the app's CSP, which would break them;
    # do not include security-headers.conf in this location.
    add_header X-Content-Type-Options "nosniff" always;
  }

  # D-24: self-hosted PMTiles, built by `make tiles` into infra/tiles/ and mounted here.
  location /tiles/ {
    alias /srv/tiles/;
    include /etc/nginx/snippets/security-headers.conf;  # add_header here replaces the server's
    add_header Accept-Ranges bytes;
  }

  location / {
    try_files $uri /index.html;
  }
}
