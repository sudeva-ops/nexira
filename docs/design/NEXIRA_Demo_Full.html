<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEXIRA · Global Resilience Platform</title>
<style>
:root{--bg:#111418;--bg2:#1C2127;--panel:#1C2127;--panel2:#252A31;--panel3:#2F343C;--line:#2F343C;--line2:#404854;--tx:#F6F7F9;--tx2:#ABB3BF;--tx3:#738091;--cy:#4C90F0;--bl:#2D72D2;--rd:#E76A6E;--am:#EC9A3C;--gr:#32A467;--vi:#9D7FDB}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--tx);font:12px/1.4 -apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#404854}::-webkit-scrollbar-track{background:transparent}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.sm{width:13px;height:13px}svg.i.lg{width:20px;height:20px}
.mono{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace}

#app{display:grid;grid-template-columns:212px 1fr;height:100vh}
aside{display:flex;flex-direction:column;background:#1C2127;border-right:1px solid #111418;min-height:0}
.brand{display:flex;align-items:center;gap:8px;padding:0 12px;height:44px;border-bottom:1px solid #111418;background:#252A31;flex:none}
.brand svg{width:20px;height:20px}.brand b{font-size:13px;letter-spacing:.1em;font-weight:700}
#nav{overflow:auto;flex:1;min-height:0;padding-bottom:6px}
.nav-g{font-size:10px;letter-spacing:.08em;padding:10px 12px 3px;color:#5F6B7C;font-weight:600}
.nav{display:flex;align-items:center;gap:9px;width:100%;text-align:left;position:relative;color:var(--tx2);font-weight:500;padding:5px 12px;font-size:12px}
.nav:hover{background:#252A31;color:var(--tx)}
.nav.on{background:#2D72D2;color:#fff}
.nav .new{margin-left:auto;font-size:9px;font-weight:700;color:#8ABBFF;border:1px solid #2D72D2;padding:0 4px;letter-spacing:.04em}
.nav.on .new{color:#fff;border-color:#fff}
.nav .bdg{margin-left:auto;color:#fff;font-weight:700;background:#CD4246;font-size:10px;padding:0 5px}
.tenant{margin:0 8px 8px;background:#252A31;padding:8px;flex:none}
.tenant .t1{font-weight:600;font-size:12px}.tenant .t2{color:var(--tx3);font-size:11px;margin-top:2px;display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--gr);display:inline-block}

main{display:grid;grid-template-rows:44px 1fr;min-width:0;min-height:0;position:relative}
header{display:flex;align-items:center;gap:10px;padding:0 12px;background:#252A31;border-bottom:1px solid #111418}
header h1{font-size:13px;font-weight:600}header .crumb{color:var(--tx3);font-size:11px}
.search{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--tx3);background:#111418;border:1px solid #404854;padding:4px 8px;width:300px}
.search input{background:none;border:0;outline:0;flex:1;color:var(--tx)}
.kbd{font-size:10px;border:1px solid var(--line2);padding:0 4px;color:var(--tx3)}
.sim{font-weight:700;letter-spacing:.08em;font-size:10px;padding:3px 6px;background:rgba(236,154,60,.15);border:1px solid #C87619;color:#FBB360}
.clock{color:var(--tx2);text-align:right;line-height:1.25;font-family:ui-monospace,Consolas,monospace;font-size:11px}.clock b{color:var(--tx);font-weight:600}
.iconbtn{display:grid;place-items:center;color:var(--tx2);position:relative;width:28px;height:28px}
.iconbtn:hover{background:#2F343C}
.iconbtn .pip{position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--rd)}
.avatar{display:grid;place-items:center;font-weight:700;flex:none;background:#404854;color:#F6F7F9;width:28px;height:28px;font-size:11px}
#view{overflow:auto;min-height:0;padding:8px 8px 80px}#view.full{overflow:hidden;padding:8px 8px 70px}

.card{position:relative;background:#1C2127;border:1px solid #111418;box-shadow:0 0 0 1px rgba(17,20,24,.4)}
.card .hd{display:flex;align-items:center;gap:8px;padding:0 10px;height:32px;background:#252A31;border-bottom:1px solid #111418}
.card .hd h3{font-size:12px;font-weight:600;white-space:nowrap}
.card .hd .sub{color:var(--tx3);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .bd{padding:10px}
.row{display:flex;align-items:center;gap:10px}.grow{flex:1;min-width:0}
.dim{color:var(--tx3)}
.chip{display:inline-flex;align-items:center;gap:5px;font-weight:600;color:var(--tx2);white-space:nowrap;font-size:10.5px;padding:1px 6px;background:#2F343C}
.chip i{width:6px;height:6px;border-radius:50%;display:inline-block}
.chip.tg{cursor:pointer;border:1px solid transparent}.chip.tg.on{background:rgba(45,114,210,.25);color:#8ABBFF;border-color:#2D72D2}
.sev{font-weight:700;font-size:10px;letter-spacing:.04em;padding:1px 5px;white-space:nowrap}
.sev.crit{background:#CD4246;color:#fff}.sev.high{background:#C87619;color:#fff}.sev.med{background:rgba(236,154,60,.25);color:#FBB360}
.sev.low{background:rgba(76,144,240,.2);color:#8ABBFF}.sev.ok{background:rgba(50,164,103,.22);color:#72CA9B}.sev.nt{background:#2F343C;color:#ABB3BF}
.btn{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--tx);padding:5px 10px;font-size:12px;background:#383E47;box-shadow:inset 0 0 0 1px rgba(17,20,24,.6)}
.btn:hover{background:#2F343C}
.btn.pri{background:#2D72D2;color:#fff}.btn.pri:hover{background:#215DB0}
.btn.red{background:#CD4246;color:#fff}.btn.grn{background:#238551;color:#fff}
.btn.sm{padding:3px 8px;font-size:11.5px}
table{width:100%;border-collapse:collapse}
th{text-align:left;position:sticky;top:0;font-size:10px;letter-spacing:.04em;padding:6px 8px;background:#252A31;border-bottom:1px solid #111418;font-weight:600;color:#ABB3BF;z-index:1}
td{color:var(--tx2);padding:5px 8px;border-bottom:1px solid #252A31;font-size:12px}
td b{color:var(--tx);font-weight:600}
tr:nth-child(even) td{background:rgba(37,42,49,.45)}
tr:hover td{background:rgba(45,114,210,.15)}
tr.sel td{background:rgba(45,114,210,.25)!important}
tr.click{cursor:pointer}
.av{display:grid;place-items:center;font-weight:700;flex:none;width:22px;height:22px;font-size:9.5px}
.bar{overflow:hidden;height:4px;background:#2F343C}.bar>i{display:block;height:100%;background:#4C90F0;transition:width .8s}
.kpi{padding:8px 10px}
.kpi .l{color:var(--tx3);font-weight:600;text-transform:uppercase;display:flex;align-items:center;gap:6px;font-size:10px;letter-spacing:.06em}
.kpi .v{font-size:20px;font-weight:600;margin-top:2px;font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;letter-spacing:-.02em}
.kpi .d{color:var(--tx3);font-size:11px}
.card.alert{border-left:3px solid #CD4246}
.up{color:#72CA9B}.down{color:#FA999C}
.tabs{display:flex}.tabs button{color:var(--tx3);font-weight:600;padding:6px 10px;border-bottom:2px solid transparent;font-size:12px}
.tabs button.on{color:#4C90F0;border-bottom-color:#2D72D2}
.g2{display:grid;grid-template-columns:1.4fr 1fr;gap:8px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.g5{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.mb{margin-bottom:8px}
.lbl{font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--tx3);margin-bottom:6px;text-transform:uppercase}
.banner{display:flex;align-items:center;gap:10px;padding:8px 12px;margin-bottom:8px;border-left:3px solid #2D72D2;background:rgba(45,114,210,.12)}
.banner.r{border-left-color:#CD4246;background:rgba(205,66,70,.14)}.banner.g{border-left-color:#32A467;background:rgba(50,164,103,.12)}.banner.a{border-left-color:#EC9A3C;background:rgba(236,154,60,.12)}
.banner b{color:var(--tx)}

/* ops */
.ops{display:grid;grid-template-columns:1fr 360px;grid-template-rows:auto 1fr;gap:8px;height:100%}
.kpis{grid-column:1/-1;display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.mapwrap{position:relative;overflow:hidden;min-height:0;background:#0E1013}
#map{width:100%;height:100%;display:block;cursor:grab}
.mapwrap::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(171,179,191,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(171,179,191,.04) 1px,transparent 1px);background-size:32px 32px}
.mapwrap .ov{position:absolute;z-index:3}
.legend{left:8px;top:8px;display:flex;gap:4px;flex-wrap:wrap}
.legend .chip,.maptitle,.mapctl button{background:#252A31;border:1px solid #111418}
.mapctl{right:8px;top:8px;display:flex;flex-direction:column}
.mapctl button{display:grid;place-items:center;color:var(--tx2);width:28px;height:28px}.mapctl button:hover{color:#fff}
.maptitle{left:8px;bottom:8px;padding:6px 10px}
.maptitle .a{color:var(--tx3);letter-spacing:.06em;font-weight:700;font-size:10px}.maptitle .b{font-weight:600;font-size:12.5px}
.land{fill:#2A3038;stroke:#3E4650;stroke-width:.6;vector-effect:non-scaling-stroke}
.grat{stroke:rgba(171,179,191,.08);stroke-width:.6;vector-effect:non-scaling-stroke;fill:none}
.pulse{animation:pulse 2.6s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%{transform:scale(.4);opacity:.9}100%{transform:scale(2.6);opacity:0}}
.arc{fill:none;stroke-width:1.2;vector-effect:non-scaling-stroke;stroke-dasharray:4 5;animation:dash 1.4s linear infinite}
@keyframes dash{to{stroke-dashoffset:-18}}
.mk{cursor:pointer}
#tip{position:fixed;z-index:70;pointer-events:none;background:#383E47;border:1px solid #111418;padding:7px 10px;font-size:12px;box-shadow:0 8px 24px rgba(0,0,0,.5);display:none;max-width:280px}
#tip b{display:block;margin-bottom:2px}
.norm{left:8px;bottom:70px;width:380px;padding:10px 12px;background:#252A31;border:1px solid #404854;border-left:3px solid #2D72D2;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.norm h4{display:flex;align-items:center;gap:6px;margin-bottom:6px;letter-spacing:.06em;color:#8ABBFF;font-size:11px}
.nstep{display:flex;gap:8px;align-items:flex-start;padding:4px 0;color:var(--tx3);font-size:12px;transition:.3s}
.nstep .ck{width:16px;height:16px;border:1px solid var(--line2);display:grid;place-items:center;flex:none;margin-top:1px}
.nstep.on{color:var(--tx)}.nstep.on .ck{border-color:var(--gr);background:rgba(50,164,103,.2);color:#72CA9B}
.nstep.run .ck{border-color:var(--cy);border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.nstep em{font-style:normal;font-weight:600;color:#8ABBFF}
.side{display:flex;flex-direction:column;min-height:0}
.feed{overflow:auto;flex:1}
.fi{position:relative;transition:.3s;animation:slidein .4s;border-bottom:1px solid #252A31;padding:8px 10px 8px 13px}
.fi:hover{background:#252A31}
.fi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c,#4C90F0)}
.fi .t{font-weight:600;color:var(--tx);margin:4px 0 2px}
.fi .m{font-size:11px;color:var(--tx3);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.fi.raw{border-bottom:1px dashed #404854;background:rgba(76,144,240,.06)}
.fi.fused{background:rgba(205,66,70,.14)}
.fi.out{opacity:0;transform:translateX(30px);max-height:0;padding:0!important;border:0}
@keyframes slidein{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
.src{display:inline-flex;align-items:center;gap:4px;color:var(--tx2);padding:1px 6px;background:#2F343C;font-size:10px}
.src i{width:6px;height:6px;border-radius:1px;display:inline-block}
.istat{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px}
.istat div{text-align:center;background:#252A31;padding:6px}.istat b{display:block;font-size:17px;font-family:ui-monospace,Consolas,monospace}.istat span{font-size:10.5px;color:var(--tx3)}
.plist{overflow:auto;flex:1;padding:0 8px}
.pp{display:flex;align-items:center;gap:8px;border-bottom:1px solid #252A31;padding:6px 2px}
.pp .n{font-weight:600}.pp .r{font-size:11px;color:var(--tx3)}

#toasts{position:fixed;z-index:60;display:flex;flex-direction:column;top:52px;right:10px;width:340px;gap:6px}
.toast{display:flex;gap:10px;animation:tin .3s;background:#383E47;box-shadow:0 8px 24px rgba(0,0,0,.5);padding:10px}
.toast.crit{background:#CD4246}.toast.crit span{color:#fde2e2}.toast.crit .ti{background:rgba(0,0,0,.2)!important;color:#fff!important}
.toast.ok{border-left:3px solid #32A467}.toast.info{border-left:3px solid #2D72D2}
.toast .ti{display:grid;place-items:center;flex:none;width:26px;height:26px}
.toast b{display:block;font-size:12px}.toast span{font-size:11.5px;color:var(--tx2)}
@keyframes tin{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
#presenter{position:fixed;left:calc(50% + 106px);transform:translateX(-50%);bottom:10px;z-index:40;display:flex;align-items:center;gap:4px;background:#252A31;border:1px solid #111418;box-shadow:0 8px 24px rgba(0,0,0,.6);padding:4px}
#presenter .lbl{font-size:10px;letter-spacing:.08em;font-weight:700;color:var(--tx3);padding:0 8px 0 6px;line-height:1.2;margin:0;text-transform:none}
#presenter .lbl b{display:block;color:var(--tx);letter-spacing:0;font-size:11.5px}
.sc{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--tx3);padding:5px 8px}
.sc .n{width:18px;height:18px;display:grid;place-items:center;font-size:10px;border:1px solid var(--line2)}
.sc.done{color:var(--tx2)}.sc.done .n{background:rgba(50,164,103,.25);border-color:var(--gr);color:#72CA9B}
.sc.on{color:#fff;background:#2D72D2}.sc.on .n{background:#fff;color:#2D72D2;border-color:#fff}
.pbtn{display:grid;place-items:center;color:var(--tx2);width:28px;height:28px;background:#383E47}.pbtn:hover{color:#fff}
.pbtn.play{background:#2D72D2;color:#fff}

.pbgrid{display:grid;grid-template-columns:270px 1fr 340px;gap:8px;height:100%}
.pbitem{cursor:pointer;border-bottom:1px solid #252A31;padding:8px 10px}
.pbitem.on{background:rgba(45,114,210,.18);border-left:3px solid #2D72D2}
.pbitem .c{font-size:10px;color:var(--tx3);font-weight:700;letter-spacing:.06em}.pbitem .t{font-weight:600;margin-top:2px}
.step{display:flex;gap:12px;position:relative;padding-bottom:12px}
.step:not(:last-child)::after{content:"";position:absolute;left:12px;top:28px;width:1px;bottom:2px;background:var(--line2)}
.step.done:not(:last-child)::after{background:var(--gr)}
.step .ic{display:grid;place-items:center;border:1px solid var(--line2);background:var(--bg2);color:var(--tx3);flex:none;z-index:1;transition:.3s;width:26px;height:26px}
.step.done .ic{border-color:var(--gr);background:rgba(50,164,103,.2);color:#72CA9B}
.step.run .ic{border-color:var(--cy);color:var(--cy)}
.step.await .ic{border-color:var(--am);color:var(--am);background:rgba(236,154,60,.15)}
.step .tt{font-weight:600;color:var(--tx)}.step.pend .tt{color:var(--tx3)}
.step .ds{font-size:11.5px;color:var(--tx3);margin-top:1px}
.step .meta{margin-left:auto;font-size:11px;color:var(--tx3);font-family:ui-monospace,Consolas,monospace;white-space:nowrap}
.log{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-size:11px}
.log div{padding:5px 0;border-bottom:1px dashed #2F343C;color:var(--tx2)}.log span{color:var(--tx3);margin-right:8px}

.cigrid{display:grid;grid-template-columns:1fr 1fr 320px;gap:8px}
.phone{width:280px;height:570px;background:#000;border:10px solid #2F343C;border-radius:36px;box-shadow:0 0 0 1px #404854,0 20px 40px rgba(0,0,0,.7);position:relative;overflow:hidden;margin:0 auto}
.phone .scr{position:absolute;inset:0;background:radial-gradient(circle at 30% 20%,#1F3A63,#111418 60%);padding:46px 14px 14px;display:flex;flex-direction:column}
.phone .notch{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:96px;height:26px;background:#000;border-radius:20px;z-index:2}
.phone .time{text-align:center;font-size:52px;font-weight:300;color:#fff;margin-top:10px}
.phone .date{text-align:center;color:#c7d2fe;font-size:13px}
.ntf{margin-top:auto;background:rgba(255,255,255,.12);backdrop-filter:blur(20px);border-radius:18px;padding:14px;color:#fff}
.ntf .h{display:flex;align-items:center;gap:8px;font-size:11px;color:#cbd5e1}
.ntf .ap{width:20px;height:20px;border-radius:5px;background:#2D72D2;display:grid;place-items:center}
.ntf .b{font-weight:700;margin:8px 0 4px;font-size:13.5px}.ntf .x{font-size:12.5px;color:#e2e8f0;line-height:1.4}
.ntf .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.ntf .acts button{padding:10px;border-radius:12px;font-weight:700;font-size:12.5px}
.resp{display:flex;align-items:center;gap:8px;border-bottom:1px solid #252A31;padding:6px 2px}.resp.new{animation:slidein .4s}

.cpgrid{display:grid;grid-template-columns:1fr 310px;gap:8px;height:100%}
.chat{display:flex;flex-direction:column;min-height:0}
.msgs{flex:1;overflow:auto;padding:14px 16px}
.msg{display:flex;gap:10px;margin-bottom:16px}
.msg .who{width:28px;height:28px;display:grid;place-items:center;flex:none}
.msg.u .bub{border:1px solid var(--line2);padding:8px 12px;max-width:70%;background:#2F343C}
.msg.a .bub{flex:1;max-width:860px}
.msg.a .bub h4{font-size:14px;margin-bottom:8px}
.msg.a .bub h5{font-size:10.5px;margin:12px 0 4px;text-transform:uppercase;color:#8ABBFF;letter-spacing:.06em}
.msg.a .bub p,.msg.a .bub li{color:#C5CBD3;line-height:1.6}.msg.a .bub ol{padding-left:20px}
.caret::after{content:"▍";color:#4C90F0;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.composer{display:flex;align-items:center;gap:8px;padding:5px 5px 5px 12px;background:#111418;border:1px solid #404854;margin:0 10px 10px}
.composer input{flex:1;background:none;border:0;outline:0}
.sugs{display:flex;gap:6px;flex-wrap:wrap;margin:0 10px 8px}.sug{padding:5px 10px;font-size:11.5px;color:var(--tx2);background:#2F343C}.sug:hover{color:#fff;background:#383E47}
.thinking{display:flex;gap:5px;padding:8px 0}
.thinking i{width:6px;height:6px;border-radius:50%;background:#4C90F0;animation:bounce 1s infinite}
.thinking i:nth-child(2){animation-delay:.15s}.thinking i:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,100%{opacity:.3}50%{opacity:1}}
.intg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ic-card{padding:10px}
.logo{display:grid;place-items:center;font-weight:800;color:#fff;width:32px;height:32px;font-size:13px}
.tog{position:relative;margin-left:auto;background:#2D72D2;width:30px;height:16px}
.tog::after{content:"";position:absolute;background:#fff;width:12px;height:12px;top:2px;right:2px}
.sech{font-weight:700;letter-spacing:.08em;color:var(--tx3);text-transform:uppercase;margin:14px 0 6px;font-size:10px}
.empty{display:grid;place-items:center;text-align:center;padding:50px 20px;color:var(--tx3)}
.empty .big{width:52px;height:52px;display:grid;place-items:center;background:var(--panel3);color:var(--cy);margin:0 auto 12px}
.tl{position:relative;padding-left:18px}
.tl div{position:relative;padding:0 0 12px 6px;font-size:12px;color:var(--tx2)}
.tl div::before{content:"";position:absolute;background:var(--c,var(--cy));width:7px;height:7px;left:-16px;top:5px}
.tl::before{content:"";position:absolute;left:5px;top:6px;bottom:14px;width:1px;background:var(--line2)}
.tl b{color:var(--tx);font-weight:600}
.tl span{color:var(--tx3);font-family:ui-monospace,Consolas,monospace;margin-right:6px}
/* new modules */
.post{border-bottom:1px solid #252A31;padding:9px 12px;position:relative}
.post.hot{background:rgba(205,66,70,.10)}
.post.hot::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:#CD4246}
.post .orig{color:var(--tx);font-size:12.5px;margin:5px 0 3px}
.post .tr{color:var(--tx2);font-size:11.5px;font-style:italic}
.lang{font-family:ui-monospace,Consolas,monospace;font-weight:700;font-size:10px;padding:1px 5px;background:#383E47;color:#DCE0E5}
.ck2{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid #252A31;font-size:12px}
.ck2 .b{width:16px;height:16px;display:grid;place-items:center;flex:none}
.ck2 .b.y{background:rgba(50,164,103,.25);color:#72CA9B}.ck2 .b.n{background:rgba(236,154,60,.2);color:#FBB360}.ck2 .b.x{background:rgba(205,66,70,.3);color:#FA999C}
.pcard{padding:10px;display:flex;flex-direction:column;gap:8px}
.funnel{display:grid;grid-template-columns:110px 1fr 54px;gap:8px;align-items:center;font-size:12px;padding:5px 0}
.stack{display:flex;height:14px;background:#2F343C}.stack i{display:block;height:100%}
.room{cursor:default}
.legend2{display:flex;gap:12px;font-size:11px;color:var(--tx2);flex-wrap:wrap}
.legend2 span{display:inline-flex;align-items:center;gap:5px}.legend2 i{width:8px;height:8px;display:inline-block}
#toasts .toast:nth-child(n+4){display:none}</style>
</head>

  return `${A.paused ? `<div class="banner r">${ic('alert')}<div class="grow"><b>All agents paused (kill switch).</b> Platform has fallen back to manual playbooks; no new proposals will be raised.</div><button class="btn sm" onclick="A.paused=false;go('queue',true)">Resume agents</button></div>`

  <div class="g4 mb">${K('Awaiting your decision', 'inbox', tabs.pending.length, tabs.pending.length ? 'Oldest first by deadline' : 'Queue clear', tabs.pending.length ? '#FBB360' : '#72CA9B')}${K('Raised proactively', 'trend', proN, 'Before any incident occurred')}${K('Median time to decide', 'clock', med === null ? '—' : med + ' s', 'This session')}${K('Accepted by humans', 'check', dec.length ? Math.round(accepted / dec.length * 100) + '%' : '—', `${dec.length} decisions this session`)}</div>
  <div style="display:grid;grid-template-columns:1fr 320px;gap:8px">
   <div><div class="row mb" style="gap:8px"><div class="tabs">${[['pending', `Pending (${tabs.pending.length})`], ['decided', `Decided (${tabs.decided.length})`], ['all', 'All']].map(([k, n]) => `<button class="${A.tab === k ? 'on' : ''}" onclick="A.tab='${k}';go('queue',true)">${n}</button>`).join('')}</div></div>
    ${list.length ? list.map(cardHTML).join('') : `<div class="card"><div class="empty"><div><div class="big">${ic('inbox', 'lg')}</div><h3 style="color:var(--tx);font-size:15px">${A.tab === 'pending' ? 'No decisions waiting' : 'Nothing here yet'}</h3><p style="margin-top:6px">${A.paused ? 'Agents are paused.' : 'Agents will raise proposals as conditions change.'}</p></div></div></div>`}</div>
   <div style="display:flex;flex-direction:column;gap:8px">
    <div class="card">${HD('bot', 'Agent activity', 'Live')}<div class="bd log" style="max-height:330px;overflow:auto">${A.log.length ? A.log.map(l => `<div><span>${l[0]}</span><b style="color:${l[1] === 'Human' ? '#72CA9B' : '#8ABBFF'};font-weight:600">${l[1]}</b> · ${l[2]}</div>`).join('') : '<div class="dim" style="border:0">Agents are scanning…</div>'}</div></div>
    <div class="card">${HD('shield', 'Decision policy')}<div class="bd" style="display:grid;gap:5px;font-size:12px">${LV.map((l, i) => `<div class="row" style="gap:8px"><span class="chip" style="color:${LVC[i]};min-width:104px">${l}</span><span class="dim">${['Enrich, match, update maps', 'Internal actions · 30 s undo', 'Staff alerts, partners, diversions', 'Evacuation, mission closure', 'Legal or diplomatic positions'][i]}</span></div>`).join('')}</div></div>
   </div></div>`;
};
R_.agents = () => {
  A.view = 'agents';
  return `<div class="banner ${A.paused ? 'r' : 'g'}">${ic(A.paused ? 'pause' : 'bot')}<div class="grow"><b>${A.paused ? 'Agents paused.' : 'Agents active · running on sovereign infrastructure.'}</b> Agents act only through platform APIs with the same role-based permissions as people; every output is logged.</div><button class="btn ${A.paused ? 'pri' : 'red'} sm" onclick="A.paused=!A.paused;toast(A.paused?'crit':'ok',A.paused?'Kill switch engaged':'Agents resumed',A.paused?'All agents paused · manual playbooks in effect':'Proposals will resume');go('agents',true)">${A.paused ? 'Resume all agents' : 'Kill switch · pause all'}</button></div>
  <div class="g4 mb">${K('Agents', 'bot', Object.keys(AGENTS).length, A.paused ? 'Paused' : 'All healthy', A.paused ? '#FA999C' : '')}${K('Proposals · 30 days', 'inbox', Object.values(AGENTS).reduce((a, g) => a + g[3], 0).toLocaleString(), 'Plus this session: ' + A.cards.length)}${K('Human override rate', 'users', '11%', '30 days · used to tune agents')}${K('Actions outside approval', 'shield', '0', 'Policy engine enforced', '#72CA9B')}</div>
  <div class="card">${HD('bot', 'Agent roster', 'Set autonomy per agent · policy floors still apply (e.g. evacuation always needs senior approval)')}
   <table><thead><tr><th>Agent</th><th>Watches</th><th>Autonomy level</th><th>Proposals · 30d</th><th>Accepted</th><th>This session</th><th>Status</th></tr></thead><tbody>
   ${Object.entries(AGENTS).map(([k, g]) => { const mine = A.cards.filter(c => c.ag === k); return `<tr><td><div class="row" style="gap:8px">${ic('bot', 'sm')}<b>${g[0]}</b></div></td><td>${g[1]}</td><td><select onchange="A.lv['${k}']=+this.value;aLog('Human','Autonomy for ${g[0]} set to '+LV[+this.value]);go('agents',true)" style="background:#111418;border:1px solid #404854;color:${LVC[A.lv[k]]};padding:3px 6px">${LV.map((l, i) => `<option value="${i}" ${A.lv[k] === i ? 'selected' : ''}>${l}</option>`).join('')}</select></td><td class="mono">${g[3]}</td><td><div class="row" style="gap:6px"><div class="bar" style="width:50px"><i style="width:${g[4]}%"></i></div><span class="mono">${g[4]}%</span></div></td><td class="mono">${mine.length}</td><td>${A.paused ? sev('crit', 'PAUSED') : sev('ok', 'ACTIVE')}</td></tr>`; }).join('')}</tbody></table></div>
  <div class="g2" style="margin-top:8px">
   <div class="card">${HD('shield', 'Guardrails')}<div class="bd" style="padding:4px 10px">${tick('y', 'No external message, spend or movement of people without human approval')}${tick('y', 'Evacuation & mission closure need two approvers')}${tick('y', 'Every proposal cites sources and confidence')}${tick('y', 'Models hosted in-country · no external API calls')}${tick('y', 'Agents tested against exercise scenarios before go-live')}</div></div>
   <div class="card">${HD('layers', 'Where agents sit in the architecture')}<div class="bd" style="font-size:12px;display:grid;gap:6px">${['Data platform & connectors', 'Intelligence & AI layer (fusion, scoring, LLM)', '▶ Agent orchestration + policy engine', 'Business modules (playbooks, comms, evacuation…)', 'Human approval · Decision Queue'].map((l, i) => `<div style="padding:6px 10px;background:${i === 2 ? 'rgba(45,114,210,.25)' : '#252A31'};border-left:3px solid ${i === 2 ? '#2D72D2' : '#404854'}">${l}</div>`).join('')}</div></div></div>`;
};

/* ---------- navigation, header pill, scenario hooks ---------- */
(function () { const o = { ...VIEWS }; Object.keys(VIEWS).forEach(k => delete VIEWS[k]); VIEWS.queue = ['Decision Queue', 'Command · Agent proposals awaiting human decision', 'inbox', 'COMMAND']; VIEWS.agents = ['AI Agents', 'Command · Agent roster, autonomy & guardrails', 'bot', 'COMMAND']; Object.assign(VIEWS, o); NEWV.add('queue'); NEWV.add('agents'); })();
const _navBadge3 = navBadge; navBadge = k => k === 'queue' && pending() ? `<span class="bdg">${pending()}</span>` : k === 'agents' && A.paused ? '<span class="bdg">II</span>' : _navBadge3(k);
document.querySelector('header .sim').insertAdjacentHTML('beforebegin', '<button class="btn sm" id="agpill" onclick="go(\'queue\')" style="background:#2F343C"></button>');
SCENES[0][1] = 'queue';
const _goA = go; go = function (v, soft) { if (v !== 'queue' && v !== 'agents') A.view = v; _goA(v, soft); };
setInterval(() => {
  agentTick();
  const n = pending(); const p = $('#agpill'); if (p) p.innerHTML = `${ic('bot', 'sm')}${A.paused ? 'Agents paused' : n ? `<b style="color:#FBB360">${n}</b>&nbsp;decision${n > 1 ? 's' : ''} pending` : 'Agents active'}`;
  const sig = A.cards.map(c => c.k + c.st + c.appr.length).join() + A.paused;
  if (sig !== A.sig) { A.sig = sig; renderNav(); if ((S.view === 'queue' || S.view === 'agents') && !A.editing && !A.rejecting) go(S.view, true); }
  else if (S.view === 'queue') document.querySelectorAll('#view .hd .dim').forEach(() => { });
  if (S.view === 'queue' && !A.editing) { /* refresh countdowns cheaply */ const cards = A.cards.filter(c => c.st === 'pending'); if (cards.length) go('queue', true); }
}, 1000);

/* boot */
seedFeed(); renderPresenter(); go('queue');
</script>
</body>
</html>
