# Non-secret settings for the backend and worker (backend/app/core/config.py).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nexira.fullname" . }}-config
  labels: {{- include "nexira.labels" . | nindent 4 }}
data:
  OIDC_ISSUER: {{ required "oidc.issuer is required" .Values.oidc.issuer | quote }}
  OIDC_JWKS_URL: {{ required "oidc.jwksUrl is required" .Values.oidc.jwksUrl | quote }}
  OIDC_AUDIENCE: {{ .Values.oidc.audience | quote }}
  HOME_TZ: {{ .Values.app.homeTz | quote }}
  LLM_PROVIDER: {{ .Values.llm.provider | quote }}
  LLM_BASE_URL: {{ .Values.llm.baseUrl | quote }}
  LLM_MODEL: {{ .Values.llm.model | quote }}
  WORKER_TENANT_IDS: {{ .Values.app.workerTenantIds | toJson | quote }}
  UNDO_WINDOW_S: {{ .Values.app.undoWindowS | quote }}
  PLAYBOOK_STEP_DELAY_S: "0"
  CHANNEL_ADAPTER: simulated  # CHK-04: the only adapter in Phase 1
  PYTHONDONTWRITEBYTECODE: "1"
