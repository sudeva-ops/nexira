{{- if .Values.secrets.create }}
{{- $v := .Values.secrets.values }}
# Test clusters only (secrets.create). Four Secrets, one per user, so each
# workload mounts only its own (D-01): the API never sees the owner password.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nexira.secret" (list . "api") }}
  labels: {{- include "nexira.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ required "secrets.values.apiDatabaseUrl" $v.apiDatabaseUrl | quote }}
  REDIS_URL: {{ required "secrets.values.redisUrl" $v.redisUrl | quote }}
---
# The owner DSN exists before the pre-install migrate hook runs.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nexira.secret" (list . "owner") }}
  labels: {{- include "nexira.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
type: Opaque
stringData:
  MIGRATIONS_DATABASE_URL: {{ required "secrets.values.ownerDatabaseUrl" $v.ownerDatabaseUrl | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nexira.secret" (list . "backup") }}
  labels: {{- include "nexira.labels" . | nindent 4 }}
type: Opaque
stringData:
  PGPASSWORD: {{ required "secrets.values.backupPassword" $v.backupPassword | quote }}
{{- if .Values.redis.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nexira.secret" (list . "redis") }}
  labels: {{- include "nexira.labels" . | nindent 4 }}
type: Opaque
stringData:
  REDIS_PASSWORD: {{ required "secrets.values.redisPassword" $v.redisPassword | quote }}
{{- end }}
{{- end }}
