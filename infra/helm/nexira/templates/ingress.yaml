{{- $fullname := include "nexira.fullname" . }}
{{- if .Values.ingress.enabled }}
# TLS terminates here (NFR 2): configure the controller for TLS 1.3 (runbook).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}
  labels: {{- include "nexira.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  tls:
    - hosts: [{{ required "ingress.host is required" .Values.ingress.host | quote }}]
      secretName: {{ required "ingress.tlsSecret is required (no plain HTTP)" .Values.ingress.tlsSecret }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}-frontend
                port: { name: http }
{{- end }}
{{- if .Values.route.enabled }}
---
# OpenShift Route with edge TLS; plain HTTP is redirected.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ $fullname }}
  labels: {{- include "nexira.labels" . | nindent 4 }}
spec:
  host: {{ required "route.host is required" .Values.route.host | quote }}
  to:
    kind: Service
    name: {{ $fullname }}-frontend
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
{{- end }}
