{{- if .Values.migrate.enabled }}
# Alembic as nexira_owner before every install and upgrade (D-01). The only pod
# that gets the owner Secret; it has no API secret and no network but the database.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "nexira.fullname" . }}-migrate
  labels: {{- include "nexira.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels: {{- include "nexira.selector" (list . "migrate") | nindent 8 }}
    spec:
      {{- include "nexira.podCommon" . | nindent 6 }}
      restartPolicy: Never
      containers:
        - name: migrate
          image: {{ include "nexira.image" (list . .Values.images.backend) }}
          imagePullPolicy: {{ .Values.pullPolicy }}
          command: ["alembic", "upgrade", "head"]
          securityContext: {{- include "nexira.containerSecurityContext" . | nindent 12 }}
          env:
            - { name: PYTHONDONTWRITEBYTECODE, value: "1" }
          envFrom:
            - secretRef: { name: {{ include "nexira.secret" (list . "owner") }} }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
{{- end }}
